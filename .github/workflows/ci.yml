name: Go CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$files" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit and HTTP tests
        run: go test ./...
      - name: Benchmark harness regression tests
        shell: pwsh
        run: ./scripts/test-benchmark.ps1
      - name: Build release binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/api ./cmd/api
          CGO_ENABLED=0 go build -trimpath -o bin/worker ./cmd/worker
      - name: Scan source and release binaries for reachable vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary bin/api
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary bin/worker

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LINE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Required PostgreSQL, private S3 and Docker workflows
        shell: pwsh
        run: ./scripts/verify-uc9.ps1
      - name: Guarded demo accounts and real API verification
        shell: pwsh
        run: ./scripts/verify-demo-seed.ps1
