services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sa_lathe_shop}
      POSTGRES_USER: ${DB_USER:-sa_lathe_shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a private DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: ghcr.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set a private S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set a private S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-sa-lathe-shop-private}
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:8333"
    volumes:
      - s3-data:/data
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HTTP_ADDR: :8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sa_lathe_shop}
      DB_USER: ${DB_USER:-sa_lathe_shop}
      DB_PASSWORD: ${DB_PASSWORD:?Set a private DB_PASSWORD}
      DB_SSLMODE: disable
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:19000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sa-lathe-shop-private}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set a private S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set a private S3_SECRET_KEY}
      S3_PATH_STYLE: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sa_lathe_shop}
      DB_USER: ${DB_USER:-sa_lathe_shop}
      DB_PASSWORD: ${DB_PASSWORD:?Set a private DB_PASSWORD}
      DB_SSLMODE: disable
      LINE_ENABLED: ${LINE_ENABLED:-false}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_ADMIN_USER_ID: ${LINE_ADMIN_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
volumes:
  postgres-data:
  s3-data:
