    post:
      tags: [Procurement and receiving]
      summary: Place a supplier order
      x-allowed-roles: [admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /material-orders/{order_id}:
    get:
      tags: [Procurement and receiving]
      summary: Read a material order
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /material-orders/{order_id}/actions:
    post:
      tags: [Procurement and receiving]
      summary: Record supplier response or cancel an unreceived order
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /receiving/orders:
    get:
      tags: [Procurement and receiving]
      summary: List receiving orders
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
  /receiving/orders/{order_id}:
    get:
      tags: [Procurement and receiving]
      summary: Read receipt and replacement status
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /receiving/orders/{order_id}/receipts:
    post:
      tags: [Procurement and receiving]
      summary: Record a partial receipt
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
