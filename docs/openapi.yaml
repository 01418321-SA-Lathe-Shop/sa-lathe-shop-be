  /receiving/orders/{order_id}/claims/{claim_id}/submit:
    post:
      tags: [Procurement and receiving]
      summary: Submit a replacement claim
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/OrderID'}, {$ref: '#/components/parameters/ClaimID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /receiving/orders/{order_id}/credit-terms:
    post:
      tags: [Procurement and receiving]
      summary: Record supplier credit days after full good receipt
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /receiving/orders/{order_id}/settlement:
    post:
      tags: [Procurement and receiving]
      summary: Record the one full supplier settlement
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /material-orders/{order_id}/evidence/uploads:
    post:
      tags: [Procurement and receiving]
      summary: Start a private supplier-payment evidence upload
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/OrderID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
  /order-evidence/{evidence_id}/complete:
    post:
      tags: [Procurement and receiving]
      summary: Finalize supplier-payment evidence
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/EvidenceID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /order-evidence/{evidence_id}/download:
    get:
      tags: [Procurement and receiving]
      summary: Get a private supplier-payment evidence link
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/EvidenceID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /dashboard/overview:
    get:
      tags: [Production]
      summary: Read exact creation-cohort job counts and first-completion activity
      description: Read-only shared shop report. See docs/014-dashboard.md for all response fields, calendar semantics and incomplete-history handling. No finance fields.
      x-allowed-roles: [admin, worker]
      parameters:
        - {name: range, in: query, schema: {type: string, enum: [today, 7d, 30d, year], default: 30d}}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /dashboard/jobs:
    get:
      tags: [Production]
      summary: Read paginated named jobs by creation cohort or first-completion day
      description: first_completed_on forbids range and status, and must fall in the rolling heatmap window. Total is the full filtered count, including cancelled jobs. See docs/014-dashboard.md.
      x-allowed-roles: [admin, worker]
      parameters:
        - {name: range, in: query, schema: {type: string, enum: [today, 7d, 30d, year], default: 30d}}
        - {name: status, in: query, schema: {type: string, enum: [queued, in_progress, completed, cancelled]}}
        - {name: first_completed_on, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {$ref: '#/components/parameters/Offset'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /production/jobs:
    get:
      tags: [Production]
      summary: List production jobs
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
  /production/jobs/{job_id}:
    get:
      tags: [Production]
      summary: Read production progress with role-based financial redaction
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /production/jobs/{job_id}/labor-cost:
    put:
      tags: [Production]
      summary: Record actual labor cost
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /production/jobs/{job_id}/start:
    post:
      tags: [Production]
      summary: Start a fully reserved job
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /production/jobs/{job_id}/usage:
    post:
      tags: [Production]
      summary: Record actual material usage
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /production/jobs/{job_id}/time:
    post:
      tags: [Production]
      summary: Record actual labor minutes
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /production/jobs/{job_id}/complete:
    post:
      tags: [Production]
      summary: Complete a production cycle
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /production/jobs/{job_id}/photos/uploads:
    post:
      tags: [Production]
      summary: Start an optional private job-photo upload
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
  /job-photos/{photo_id}/complete:
    post:
      tags: [Production]
      summary: Finalize a job-photo upload
      x-allowed-roles: [worker, original uploader]
      parameters: [{$ref: '#/components/parameters/PhotoID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /job-photos/{photo_id}/download:
    get:
      tags: [Production]
      summary: Get a private job-photo download link
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/PhotoID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs:
    get:
      tags: [Customer fulfillment]
      summary: List authorized invoices, deliveries and balances
      x-allowed-roles: [admin, worker, customer, current company member]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '401': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}:
    get:
      tags: [Customer fulfillment]
      summary: Read a scoped fulfillment record
      x-allowed-roles: [admin, worker, customer, current company member]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}/credit-terms:
    put:
      tags: [Customer fulfillment]
      summary: Set invoice credit days once
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}/invoice:
    post:
      tags: [Customer fulfillment]
      summary: Issue the immutable post-deposit invoice
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}/deliveries:
    post:
      tags: [Customer fulfillment]
      summary: Record a whole-job delivery
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}/inspection:
    post:
      tags: [Customer fulfillment]
      summary: Accept delivery or return for free rework
      x-allowed-roles: [customer, current company member]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}/payments/bank:
    post:
      tags: [Customer fulfillment]
      summary: Submit a customer bank installment with private proof
      x-allowed-roles: [customer, current company member]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}/payments/cash:
    post:
      tags: [Customer fulfillment]
      summary: Record a customer cash installment
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}/payments/review:
    post:
      tags: [Customer fulfillment]
      summary: Approve or reject a pending bank payment
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /fulfillment/jobs/{job_id}/evidence/uploads:
    post:
      tags: [Customer fulfillment]
      summary: Start a private customer payment-proof upload
      x-allowed-roles: [customer, admin]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
  /customer-evidence/{evidence_id}/complete:
    post:
      tags: [Customer fulfillment]
      summary: Finalize a payment-proof upload
      x-allowed-roles: [admin, customer, original uploader]
      parameters: [{$ref: '#/components/parameters/EvidenceID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /customer-evidence/{evidence_id}/download:
    get:
      tags: [Customer fulfillment]
      summary: Get a private payment-proof download link
      x-allowed-roles: [admin, original uploader]
      parameters: [{$ref: '#/components/parameters/EvidenceID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /notifications:
    get:
      tags: [Notifications]
      summary: List the current account's in-system notifications
      x-allowed-roles: [admin, worker, customer]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '401': {$ref: '#/components/responses/Error'}}
  /notifications/{notification_id}/read:
    patch:
      tags: [Notifications]
      summary: Mark an owned notification as read
      x-allowed-roles: [admin, worker, customer]
      parameters: [{$ref: '#/components/parameters/NotificationID'}]
      responses: {'204': {description: Notification marked read}, '404': {$ref: '#/components/responses/Error'}}
  /shop-profile:
    get:
      tags: [Printed documents]
      summary: Read the shop details printed on documents (empty strings mean not provided)
      x-allowed-roles: [admin, worker, customer]
      responses: {'200': {$ref: '#/components/responses/Json'}, '401': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Printed documents]
      summary: Replace the shop details with optimistic version
      description: Body {name, address, tax_id, phone, email, bank_name, bank_account_name, bank_account_no, expected_lock_version}. Every text field may be empty.
      x-allowed-roles: [admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /customers/{customer_id}/billing:
    parameters: [{$ref: '#/components/parameters/CustomerID'}]
    get:
      tags: [Printed documents]
      summary: Read a customer's billing details for printed documents
      x-allowed-roles: [admin, worker, customer member]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Printed documents]
      summary: Replace the customer's billing details with optimistic version
      description: Body {address, tax_id, phone, email, expected_lock_version}.
      x-allowed-roles: [customer owner]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /quotations/{quotation_id}/customer-po:
    parameters: [{$ref: '#/components/parameters/QuotationID'}]
    get:
      tags: [Printed documents]
      summary: Read the customer's own PO details for an accepted quotation
      x-allowed-roles: [admin, worker, authorized customer member]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Printed documents]
      summary: Create (expected_lock_version 0) or edit the customer's PO details
      description: Body {po_no, issued_on (YYYY-MM-DD), remarks, expected_lock_version}. Allowed only while the accepted terms require a PO and no PO evidence is approved. The amount is the quotation's final price and is not stored.
      x-allowed-roles: [authorized customer member]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    RequestID: {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
    QuotationID: {name: quotation_id, in: path, required: true, schema: {type: string, format: uuid}}
    CustomerID: {name: customer_id, in: path, required: true, schema: {type: string, format: uuid}}
    AttachmentID: {name: attachment_id, in: path, required: true, schema: {type: string, format: uuid}}
    EvidenceID: {name: evidence_id, in: path, required: true, schema: {type: string, format: uuid}}
    MaterialID: {name: material_id, in: path, required: true, schema: {type: string, format: uuid}}
    JobID: {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    SupplierID: {name: supplier_id, in: path, required: true, schema: {type: string, format: uuid}}
    OrderID: {name: order_id, in: path, required: true, schema: {type: string, format: uuid}}
    ClaimID: {name: claim_id, in: path, required: true, schema: {type: string, format: uuid}}
    PhotoID: {name: photo_id, in: path, required: true, schema: {type: string, format: uuid}}
    NotificationID: {name: notification_id, in: path, required: true, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Offset: {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
    Search: {name: search, in: query, required: false, schema: {type: string}}
    JobFilter: {name: job_id, in: query, required: false, schema: {type: string, format: uuid}}
  requestBodies:
    CustomerRegistration:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password, name, customer_type]
            properties:
              username: {type: string}
              password: {type: string, format: password, minLength: 12}
              name: {type: string}
              customer_type: {type: string, enum: [individual, company]}
              company_name: {type: string, description: Required for a new company account; omit when joining with an invitation.}
              invitation: {type: string, description: One-use company invitation token.}
              address: {type: string, maxLength: 500, description: Required for a new individual or company customer (1-500 characters, newlines allowed); also fills the billing address. Omit when joining with an invitation.}
    RequestCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [customer_id, description, qty, material_spec]
            properties:
              customer_id: {type: string, format: uuid}
              description: {type: string, maxLength: 10000}
              qty: {type: integer, format: int64, minimum: 1}
              material_spec: {type: string, maxLength: 2000}
              deadline: {type: string, format: date-time, description: Optional requested date; not a guaranteed production date.}
    UploadIntent:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [file_name, content_type, byte_size]
            properties:
              file_name: {type: string}
              content_type: {type: string}
              byte_size: {type: integer, format: int64, minimum: 1, maximum: 100000000}
    JsonObject:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
  responses:
    Json:
      description: Successful JSON response; see the feature contract in docs/001-UC1.md through docs/009-UC9.md.
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    Error:
      description: Consistent error response.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: {type: string}
                  message: {type: string}
security:
  - bearerAuth: []
