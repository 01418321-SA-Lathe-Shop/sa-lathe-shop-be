openapi: 3.0.3
info:
  title: SA Lathe Shop API
  version: 1.0.0
  description: >-
    Contract for the implemented UC1-UC9 HTTP API. Authorization is scoped to
    the authenticated account and current customer-company membership. Private
    file bytes use short-lived signed object-storage URLs; the API stores only
    object metadata and keys. Money is represented as decimal strings.
servers:
  - url: http://localhost:8080
    description: Local development default; check API_PORT in your environment.
tags:
  - name: Health
  - name: Authentication
  - name: Requests and files
  - name: Quotations and decisions
  - name: Deposit and PO
  - name: Materials and stock
  - name: Procurement and receiving
  - name: Production
  - name: Customer fulfillment
  - name: Notifications
  - name: Printed documents
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200': {description: API process is alive}
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness and database check
      security: []
      responses:
        '200': {description: Dependencies are ready}
        '503': {description: A required dependency is unavailable}
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer account
      security: []
      x-allowed-roles: [anonymous]
      requestBody: {$ref: '#/components/requestBodies/CustomerRegistration'}
      responses:
        '201': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Create an opaque bearer session
      security: []
      x-allowed-roles: [anonymous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/local-test/login:
    post:
      tags: [Authentication]
      summary: Password-free login for an explicitly enabled local demo account
      description: >-
        Registered only when LOCAL_TEST_ACCOUNT_ENABLE=true; otherwise 404.
        Requires a dedicated demo/test database and active seed-owned identity.
        Private/local trusted testers only; anyone reaching an enabled API can
        sign in as demo Admin. Normal permissions and revocable sessions apply.
        Ten attempts per minute per socket IP. Disabling and restarting removes
        this endpoint but does not revoke previously issued sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username:
                  type: string
                  enum: [pim.admin, anan.staff, kittipong.staff, nida.company, ploy.company, somchai]
      responses:
        '200':
          description: Normal opaque bearer session; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_at, account]
                properties:
                  access_token: {type: string, description: Opaque secret; memory only}
                  token_type: {type: string, enum: [Bearer]}
                  expires_at: {type: string, format: date-time}
                  account:
                    type: object
                    required: [id, person_id, username, name, role, is_active, created_at]
                    properties:
                      id: {type: string, format: uuid}
                      person_id: {type: string, format: uuid}
                      username: {type: string}
                      name: {type: string}
                      role: {type: string, enum: [admin, worker, customer]}
                      is_active: {type: boolean}
                      created_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {description: Disabled endpoint is not registered}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current account
      x-allowed-roles: [admin, worker, customer]
      responses:
        '200': {$ref: '#/components/responses/Json'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current bearer session
      x-allowed-roles: [admin, worker, customer]
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Error'}
  /auth/password:
    post:
      tags: [Authentication]
      summary: Change the current account's own password (rate limited)
      description: Body {current_password, new_password}. new_password follows the account password rule, must differ from current_password and must not contain the username. Revokes every other session of the account; the calling session stays active.
      x-allowed-roles: [admin, worker, customer]
      responses:
        '204': {description: Password changed}
        '400': {description: invalid_input, or invalid_current_password when current_password does not match (session stays valid)}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /admin/workers:
    get:
      tags: [Authentication]
      summary: List workers
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Authentication]
      summary: Create a worker account
      x-allowed-roles: [admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'201': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /admin/workers/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      tags: [Authentication]
      summary: Get a worker
      x-allowed-roles: [admin]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
    patch:
      tags: [Authentication]
      summary: Update or deactivate a worker
      x-allowed-roles: [admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /admin/admins:
    get:
      tags: [Authentication]
      summary: List Admins with their level (UC12)
      x-allowed-roles: [super admin]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Authentication]
      summary: Create a regular Admin (UC12)
      description: Body {username, password, name, email, phone}; same rules as Worker creation. Never creates a Super Admin.
      x-allowed-roles: [super admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'201': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /admin/admins/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      tags: [Authentication]
      summary: Deactivate or reactivate a regular Admin (UC12)
      description: Body {is_active}. A Super Admin target, including the caller, returns 403. Deactivation revokes the Admin's sessions.
      x-allowed-roles: [super admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /customers:
    get:
      tags: [Authentication]
      summary: List customer profiles for the current company
      x-allowed-roles: [customer]
      responses: {'200': {$ref: '#/components/responses/Json'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /customers/{customer_id}/invitations:
    post:
      tags: [Authentication]
      summary: Create a one-use company invitation
      x-allowed-roles: [customer, company owner only]
      parameters: [{$ref: '#/components/parameters/CustomerID'}]
      responses: {'201': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
  /customers/{customer_id}/addresses:
    parameters: [{$ref: '#/components/parameters/CustomerID'}]
    get:
      tags: [Authentication]
      summary: List the customer's addresses, default first then oldest
      description: Returns {items:[{id, contact_name, address, address_line1, address_line2, district, province, postal_code, is_default, created_at}]}. contact_name is the recipient/contact person for that address, separate from the customer's registered name; legacy rows return "".
      x-allowed-roles: [customer member]
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Authentication]
      summary: Add another address
      description: Body {contact_name?, address?, address_line1?, address_line2?, district?, province?, postal_code?, is_default?}. contact_name is optional, at most 200 characters. Give a flat address (1-500 characters) or structured lines (line1, district, province and 5-digit postal_code). Returns the new address. Addresses cannot be removed yet.
      x-allowed-roles: [customer owner]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'201': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /customers/{customer_id}/addresses/{address_id}:
    parameters: [{$ref: '#/components/parameters/CustomerID'}, {name: address_id, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      tags: [Authentication]
      summary: Replace one address (contact name and location)
      description: Same body and validation as POST; the whole address is replaced. is_default=true also makes it the billing address. Returns the saved address.
      x-allowed-roles: [customer owner]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /customers/join:
    post:
      tags: [Authentication]
      summary: Join a company with an invitation
      x-allowed-roles: [customer]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'204': {description: Membership created}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /requests:
    get:
      tags: [Requests and files]
      summary: List requests visible to the current account
      x-allowed-roles: [admin, worker, customer]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '401': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Requests and files]
      summary: Submit a custom lathe job request
      x-allowed-roles: [customer]
      requestBody: {$ref: '#/components/requestBodies/RequestCreate'}
      responses: {'201': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /requests/{request_id}:
    get:
      tags: [Requests and files]
      summary: Get a scoped request
      x-allowed-roles: [admin, worker, customer, current company member]
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /requests/{request_id}/uploads:
    post:
      tags: [Requests and files]
      summary: Begin a private request attachment upload
      x-allowed-roles: [customer, current company member]
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      requestBody: {$ref: '#/components/requestBodies/UploadIntent'}
      responses: {'201': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /uploads/{attachment_id}/complete:
    post:
      tags: [Requests and files]
      summary: Finalize and freeze an uploaded request attachment
      x-allowed-roles: [admin, customer, original uploader]
      parameters: [{$ref: '#/components/parameters/AttachmentID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
  /attachments/{attachment_id}/download:
    get:
      tags: [Requests and files]
      summary: Get a short-lived private download link
      x-allowed-roles: [admin, worker, authorized customer member]
      parameters: [{$ref: '#/components/parameters/AttachmentID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /requests/{request_id}/attachments:
    get:
      tags: [Requests and files]
      summary: List authorized request attachments
      x-allowed-roles: [admin, worker, authorized customer member]
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /quotations/estimate:
    post:
      tags: [Quotations and decisions]
      summary: Calculate a preliminary minimum price
      x-allowed-roles: [worker]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /requests/{request_id}/rejection:
    get:
      tags: [Quotations and decisions]
      summary: Read request rejection status
      x-allowed-roles: [admin, worker, authorized customer member]
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /requests/{request_id}/quotations:
    get:
      tags: [Quotations and decisions]
      summary: List quotations for a request
      x-allowed-roles: [admin, worker, authorized customer member]
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Quotations and decisions]
      summary: Create a worker quotation draft
      description: Body {material_cost, labor_cost, final_price, valid_until?, notes?}. valid_until is YYYY-MM-DD or null; notes is printed on the quotation (up to 2,000 characters).
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'201': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /requests/{request_id}/reject:
    post:
      tags: [Quotations and decisions]
      summary: Reject a request with a reason
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'204': {description: Rejection recorded}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /quotations/{quotation_id}:
    get:
      tags: [Quotations and decisions]
      summary: Read a quotation (internal costs are hidden from customers)
      x-allowed-roles: [admin, worker, authorized customer member]
      parameters: [{$ref: '#/components/parameters/QuotationID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
    patch:
      tags: [Quotations and decisions]
      summary: Edit a worker quotation draft with optimistic version
      description: Same body as create plus expected_lock_version. Omitted valid_until/notes are cleared.
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/QuotationID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /quotations/{quotation_id}/send:
    post:
      tags: [Quotations and decisions]
      summary: Send a quotation to its customer
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/QuotationID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /quotations/{quotation_id}/decision:
    get:
      tags: [Quotations and decisions]
      summary: Read the company quotation decision
      x-allowed-roles: [admin, worker, customer, current company member]
      parameters: [{$ref: '#/components/parameters/QuotationID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Quotations and decisions]
      summary: Accept or reject a sent quotation
      x-allowed-roles: [customer, current company member]
      parameters: [{$ref: '#/components/parameters/QuotationID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /requests/{request_id}/quotation-decisions:
    get:
      tags: [Quotations and decisions]
      summary: List company quotation decisions
      x-allowed-roles: [customer, current company member]
      parameters: [{$ref: '#/components/parameters/RequestID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /quotations/{quotation_id}/evidence:
    post:
      tags: [Deposit and PO]
      summary: Submit deposit or company PO evidence
      x-allowed-roles: [customer, current company member]
      parameters: [{$ref: '#/components/parameters/QuotationID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /evidence/{evidence_id}/review:
    post:
      tags: [Deposit and PO]
      summary: Approve or reject deposit/PO evidence
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/EvidenceID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /quotations/{quotation_id}/fulfillment:
    get:
      tags: [Deposit and PO]
      summary: Read deposit, PO and job opening status
      x-allowed-roles: [admin, worker, authorized customer member]
      parameters: [{$ref: '#/components/parameters/QuotationID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
  /units:
    get:
      tags: [Materials and stock]
      summary: List material units
      x-allowed-roles: [admin, worker]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Materials and stock]
      summary: Create a material unit
      x-allowed-roles: [admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /materials:
    get:
      tags: [Materials and stock]
      summary: Search materials (Workers do not receive cost fields)
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Materials and stock]
      summary: Create a material
      x-allowed-roles: [admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /materials/{material_id}:
    patch:
      tags: [Materials and stock]
      summary: Update material master data
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /materials/{material_id}/stock:
    post:
      tags: [Materials and stock]
      summary: Add stock or correct a physical count
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /materials/{material_id}/conversions:
    get:
      tags: [Materials and stock]
      summary: List a material's unit conversions, including deactivated ones
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Materials and stock]
      summary: Add a conversion where 1 unit equals factor base units
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_id, factor]
              additionalProperties: false
              properties:
                unit_id: {type: string, format: uuid}
                factor: {type: string, description: 'Positive NUMERIC(18,6) decimal string'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /materials/{material_id}/conversions/{conversion_id}/deactivate:
    post:
      tags: [Materials and stock]
      summary: Deactivate a conversion; repeating it returns the original record
      x-allowed-roles: [admin]
      parameters:
        - {$ref: '#/components/parameters/MaterialID'}
        - {name: conversion_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /materials/{material_id}/movements:
    get:
      tags: [Materials and stock]
      summary: Read material movement history
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/MaterialID'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
  /jobs/{job_id}/materials:
    get:
      tags: [Materials and stock]
      summary: Read a job material plan and reservations
      x-allowed-roles: [admin, worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '404': {$ref: '#/components/responses/Error'}}
    put:
      tags: [Materials and stock]
      summary: Save a worker material plan
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /jobs/{job_id}/materials/reserve:
    post:
      tags: [Materials and stock]
      summary: Reconcile a job plan with available stock
      x-allowed-roles: [worker]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /suppliers:
    get:
      tags: [Procurement and receiving]
      summary: Search suppliers
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses: {'200': {$ref: '#/components/responses/Json'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Procurement and receiving]
      summary: Create a supplier
      x-allowed-roles: [admin]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '400': {$ref: '#/components/responses/Error'}}
  /suppliers/{supplier_id}:
    put:
      tags: [Procurement and receiving]
      summary: Update a supplier
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/SupplierID'}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {$ref: '#/components/responses/Json'}, '409': {$ref: '#/components/responses/Error'}}
  /material-orders:
    get:
      tags: [Procurement and receiving]
      summary: List material orders
      x-allowed-roles: [admin]
      parameters: [{$ref: '#/components/parameters/JobFilter'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
